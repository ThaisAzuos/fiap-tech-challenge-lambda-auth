name: Lambda Auth CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fiap-tech-challenge-lambda-auth

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY 2>/dev/null || \
          aws ecr create-repository --repository-name $ECR_REPOSITORY

      - name: Build, tag and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=lambda-auth/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: terraform

      - name: Limpar recursos existentes no AWS
        run: |
          aws lambda remove-permission \
            --function-name fiap-tech-challenge-lambda-auth \
            --statement-id AllowAPIGatewayInvoke \
            2>/dev/null || true
          for API_ID in $(aws apigateway get-rest-apis \
            --query "items[?name=='fiap-tech-challenge-lambda-auth'].id" \
            --output text 2>/dev/null); do
            if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
              echo "Deletando API Gateway: $API_ID"
              aws apigateway delete-rest-api --rest-api-id "$API_ID" 2>/dev/null || true
              sleep 30
            fi
          done

      - name: Importar Lambda function existente
        run: |
          terraform import aws_lambda_function.auth fiap-tech-challenge-lambda-auth 2>/dev/null || true
        env:
          TF_VAR_db_host: ${{ secrets.DB_HOST }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_private_key: ${{ secrets.JWT_PRIVATE_KEY }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        working-directory: terraform

      - name: Terraform Apply
        run: |
          terraform apply -no-color -input=false -auto-approve \
            -var "db_host=${{ secrets.DB_HOST }}" \
            -var "db_name=${{ secrets.DB_NAME }}" \
            -var "db_user=${{ secrets.DB_USER }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "jwt_private_key=${{ secrets.JWT_PRIVATE_KEY }}" \
            -var "region=${{ env.AWS_REGION }}" \
            -var "environment=prod" \
            -var "aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}"
        working-directory: terraform

      - name: Publicar URL da API no resumo do workflow
        run: |
          API_URL=$(terraform output -raw api_gateway_url)
          echo "### 🚀 Lambda Auth deployed" >> $GITHUB_STEP_SUMMARY
          echo "API Gateway URL: \`${API_URL}/authenticate\`" >> $GITHUB_STEP_SUMMARY
        working-directory: terraform
