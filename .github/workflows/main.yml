name: Lambda Auth CI/CD

on:
  push:
    branches:
      - main # Ou o nome da sua branch principal
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: 'Build & Test Lambda'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # Use a versão do Python da sua Lambda

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest # Para rodar testes

      - name: Run tests
        run: pytest tests/ # Assumindo que seus testes estão no diretório 'tests/'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-lambda-auth-ecr-role # Role para ECR
          aws-region: us-east-1

      - name: Build Docker image
        id: build-image
        env:
          ECR_REPOSITORY: fiap-tech-challenge-lambda-auth
          AWS_REGION: us-east-1 # Defina a região AWS
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          docker build -t ${{ env.ECR_REPOSITORY }} .
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: build-and-test # Depende do sucesso do build e testes
    env:
      AWS_REGION: us-east-1 # Defina a região AWS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-lambda-auth-terraform-role # Role para Terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.x # Use a versão do Terraform que você está utilizando

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan \
            -var "db_host=${{ secrets.DB_HOST }}" \
            -var "db_name=${{ secrets.DB_NAME }}" \
            -var "db_user=${{ secrets.DB_USER }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "jwt_private_key=${{ secrets.JWT_PRIVATE_KEY }}" \
            -var "newrelic_lambda_layer_arn=${{ secrets.NEWRELIC_LAMBDA_LAYER_ARN }}" \
            -var "region=${{ env.AWS_REGION }}" \
            -var "environment=prod" # Ou o ambiente desejado

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment:
      name: production # Ou o nome do seu ambiente de deploy
      # url: https://your-lambda-auth-endpoint.com # Opcional: URL do endpoint da Lambda
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-lambda-auth-terraform-role # Role para Terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.x

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
