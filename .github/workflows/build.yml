name: Build & Test Lambda Auth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=xml

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-lambda-auth-ecr-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Docker image
        run: docker build -t fiap-tech-challenge-lambda-auth:${{ github.sha }} .

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          docker tag fiap-tech-challenge-lambda-auth:${{ github.sha }} ${{ env.ECR_REGISTRY }}/fiap-tech-challenge-lambda-auth:latest
          docker push ${{ env.ECR_REGISTRY }}/fiap-tech-challenge-lambda-auth:latest
