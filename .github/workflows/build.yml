name: Build & Test Lambda Auth

on:
  push:
    branches: [feature/techchallengeCelio, main]
  pull_request:
    branches: [feature/techchallengeCelio, main]

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

      - name: Build Docker image
        run: docker build -t fiap-tech-challenge-lambda-auth:${{ github.sha }} .

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        run: aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag fiap-tech-challenge-lambda-auth:${{ github.sha }} ${{ env.ECR_REGISTRY }}/fiap-tech-challenge-lambda-auth:latest
          docker push ${{ env.ECR_REGISTRY }}/fiap-tech-challenge-lambda-auth:latest
